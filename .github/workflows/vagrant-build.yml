name: Build a release
# Source: https://github.com/jonashackt/vagrant-github-actions
on:
  push:
    branches:
      - main
    paths:
      - 'version.txt'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache Vagrant boxes
        uses: actions/cache@v6
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ runner.os }}-vagrant-${{ hashFiles('Vagrantfile') }}
          restore-keys: |
            ${{ runner.os }}-vagrant-

      - name: Show Vagrant version
        run: vagrant --version

      - name: Show VirtualBox version
        run: VBoxManage --version

      - name: Build the environment
        run: vagrant up

      - name: Create a Vagrant box
        run: vagrant package --vagrantfile Vagrantfile-in-box --output ipv6-advanced-lab-$(cat version.txt).box

      - name: Store box file
        uses: actions/upload-artifact@v7
        with:
          name: vagrant-box
          path: "ipv6-advanced-lab-*.box"
